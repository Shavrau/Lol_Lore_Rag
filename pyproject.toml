[project]
name = "runeterra-lore-rag"
version = "0.2.0"
description = "RAG de alta precisao para o universo e lore de League of Legends (livros e web)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "gradio>=5.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
